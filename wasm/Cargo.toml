[package]
name = "clvk_tools_wasm"
version = "0.4.0"
edition = "2018"
authors = ["Art Yerkes <art.yerkes@gmail.com>"]
description = "tools for working with chiklisp language; compiler, repl, python and wasm bindings"
homepage = "https://prozacchiwawa.github.io/clvk_tools_rs/"
readme = "README.md"
repository = "https://github.com/Chik-Network/clvk_tools_rs"
license = "MIT"
keywords = ["chik", "chiklisp", "clvk"]
categories = ["command-line-utilities"]

[lib]
name = "clvk_tools_wasm"
crate-type = ["cdylib"]
path = "src/mod.rs"

[dependencies]
clvk_tools_rs = { path= "..", features = [] }
clvkr = { version = "0.16.0", features = ["pre-eval"] }
wasm-bindgen = "=0.2.100"
js-sys = "0.3.60"
num-bigint = "0.4.0"
num-traits = "0.2.15"
lol_alloc = "0.4.1"
